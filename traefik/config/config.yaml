global:
  checkNewVersion: true
  sendAnonymousUsage: false

log:
  level: INFO # switch to DEBUG only while troubleshooting

api:
  dashboard: true
  insecure: false # never true in prod — dashboard is reached via the labeled router above instead

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      email: support@wearjmk.com
      storage: /acme.json
      httpChallenge:
        entryPoint: web

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: web
