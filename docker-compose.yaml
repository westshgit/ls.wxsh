services:
  traefik:
    image: traefik:v3.7
    command:
      - "--configFile=/etc/traefik/traefik.yaml"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/acme.json:/acme.json
    networks:
      - web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.yourdomain.com`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=dashboard-auth"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$apr1$$replace$$with$$real$$hash"

  wearjmk:
    image: wshdock/wearjmk:latest
    restart: unless-stopped
    networks:
      - web
    volumes:
      - ./wearjmk-data:/app/data
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wearjmk.rule=Host(`wearjmk.com`) || Host(`www.wearjmk.com`)"
      - "traefik.http.routers.wearjmk.entrypoints=websecure"
      - "traefik.http.routers.wearjmk.tls.certresolver=letsencrypt"
      - "traefik.http.services.wearjmk.loadbalancer.server.port=3030"
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www.wearjmk.com/(.*)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://wearjmk.com/$${1}"
      - "traefik.http.routers.wearjmk.middlewares=www-redirect"

networks:
  web:
    driver: bridge
