services:
  traefik:
    image: traefik:v3.7
    command:
      - "--configFile=/traefik/config/traefik.yaml" # matches volume path now
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=YOUR_DNS_PROVIDER"
      - "--certificatesresolvers.letsencrypt.acme.email=you@example.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yaml:/traefik/config/traefik.yaml:ro
      - ./traefik/acme.json:/acme.json
    environment:
      - YOUR_DNS_PROVIDER_API_TOKEN=xxxx # e.g. CF_DNS_API_TOKEN for Cloudflare
    networks:
      - web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.jmkfashion.com`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=dashboard-auth"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$apr1$$replace$$with$$real$$hash"

  wearjmk:
    image: wshdock/wearjmk:latest
    restart: unless-stopped
    networks:
      - web
    volumes:
      - ./wearjmk-data:/app/data
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wearjmk.rule=HostRegexp(`^.+\\.jmkfashion\\.com$`) || Host(`jmkfashion.com`)"
      - "traefik.http.routers.wearjmk.entrypoints=websecure"
      - "traefik.http.routers.wearjmk.tls.certresolver=letsencrypt"
      - "traefik.http.routers.wearjmk.tls.domains[0].main=jmkfashion.com"
      - "traefik.http.routers.wearjmk.tls.domains[0].sans=*.jmkfashion.com"
      - "traefik.http.services.wearjmk.loadbalancer.server.port=3030"

networks:
  web:
    driver: bridge
